[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probcount"
version = "0.1.0"
description = "Probabilistic Counting of Unique Visitors using HyperLogLog and Count-Min Sketch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "mmh3",
    "bandit",
    "pip-audit",
]
experiments = [
    "matplotlib",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/probcount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "slow: marks tests that take several seconds (e.g. 1M-item accuracy trials)",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["probcount"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "pandas", "pandas.*", "yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 115
src = ["src", "tests", "dashboard", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
